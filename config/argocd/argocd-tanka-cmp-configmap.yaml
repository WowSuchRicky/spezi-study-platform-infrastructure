apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-tanka-cmp
  namespace: argocd
  annotations:
    app.kubernetes.io/part-of: argocd
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: tanka
    spec:
      init:
        command: [jb, install]
      generate:
        command: [sh, -c]
        # TODO: Figure out why Tanka container outputs "map[baggage: traceparent: tracestate:]" tracing headers to stdout
        # This grep filter is a workaround to remove OpenTelemetry tracing data that corrupts YAML parsing
        args: ["echo 'ARGOCD_ENV_COMPONENT='$ARGOCD_ENV_COMPONENT >&2 && OTEL_SDK_DISABLED=true OTEL_TRACES_EXPORTER=none OTEL_METRICS_EXPORTER=none OTEL_LOGS_EXPORTER=none /usr/local/bin/tk show --dangerous-allow-redirect . --tla-str component=$ARGOCD_ENV_COMPONENT 2>/dev/null | grep -v '^map\\[.*\\]$'"]
      discover:
        fileName: "./jsonnetfile.json"
      allowConcurrency: true
      lockRepo: false
      parameters:
        static:
        - name: "server-side-apply"
          value: "true"
        - name: "force-apply"
          value: "true"
