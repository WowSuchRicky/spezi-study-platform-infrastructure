apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-tanka-cmp
  namespace: argocd
  annotations:
    app.kubernetes.io/part-of: argocd
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: tanka
    spec:
      init:
        command: [jb, install]
      generate:
        command: [sh, -c]
        # Filter out OpenTelemetry tracing data that corrupts YAML parsing and add debugging
        args: ["echo 'ARGOCD_ENV_COMPONENT='$ARGOCD_ENV_COMPONENT >&2 && echo 'Starting Tanka generation for component: '$ARGOCD_ENV_COMPONENT >&2 && OTEL_SDK_DISABLED=true OTEL_TRACES_EXPORTER=none OTEL_METRICS_EXPORTER=none OTEL_LOGS_EXPORTER=none /usr/local/bin/tk show --dangerous-allow-redirect . --tla-str component=$ARGOCD_ENV_COMPONENT 2>/tmp/tanka-stderr-$ARGOCD_ENV_COMPONENT.log | tee /tmp/tanka-output-$ARGOCD_ENV_COMPONENT.log | grep -v '^map\\[.*\\]$' | grep -v 'traces export:' || (echo 'Tanka generation failed!' >&2; cat /tmp/tanka-stderr-$ARGOCD_ENV_COMPONENT.log >&2; exit 1)"]
      discover:
        fileName: "./jsonnetfile.json"
      allowConcurrency: true
      lockRepo: false
      parameters:
        static:
        - name: "server-side-apply"
          value: "true"
        - name: "force-apply"
          value: "true"