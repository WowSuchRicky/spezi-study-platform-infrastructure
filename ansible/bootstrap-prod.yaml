---
# Idempotent Ansible playbook to bootstrap production environment
# This playbook attempts to reproduce the behavior of setup-prod.sh using
# Ansible modules and guarded shell commands where necessary. It re-uses
# existing playbooks in this repo: provision-gke.yaml and bootstrap-keycloak.yaml

- name: Prepare GCP and Ansible environment
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Prefer values from group_vars/all.yaml; provide sane defaults
    # Internal path variable to avoid recursive templating with the external var name
    gcp_credentials_file_path: "{{ gcp_credentials_file | default(playbook_dir + '/../gcp-service-account-key.json') }}"
    gcp_project_id: "{{ spezi_service_gcp_project_id | default('spezistudyplatform-dev') }}"
    service_account_email: "spezistudyplatform-dev-svc@{{ gcp_project_id }}.iam.gserviceaccount.com"
    terraform_state_bucket: "spezistudyplatform-tf-state-prod"
    required_gcp_services:
      - secretmanager.googleapis.com
      - iamcredentials.googleapis.com
      - cloudresourcemanager.googleapis.com
      - iap.googleapis.com
    required_roles:
      - roles/storage.admin
      - roles/container.admin
      - roles/compute.admin
      - roles/iam.serviceAccountUser
      - roles/secretmanager.secretAccessor

    # ArgoCD / repo defaults (can be overridden in group_vars/all.yaml)
    argo_application_name: "root-prod"
    repo_url: "{{ spezi_service_repo_url | default('git@github.com:example-org/example-repo.git') }}"
    prod_path: "environments/prod-bootstrap"
    git_branch: "main"

  tasks:
    - name: Ensure gcloud is installed
      ansible.builtin.command: which gcloud
      register: gcloud_path
      changed_when: false
      failed_when: gcloud_path.rc != 0

    - name: Ensure kubectl is installed
      ansible.builtin.command: which kubectl
      register: kubectl_path
      changed_when: false
      failed_when: kubectl_path.rc != 0

    - name: Ensure terraform or tofu is installed (one required)
      ansible.builtin.command: bash -lc "command -v tofu || command -v terraform"
      register: terraform_like
      changed_when: false
      failed_when: terraform_like.rc != 0

    - name: Fail early if no active gcloud authentication found
      ansible.builtin.command: gcloud auth list --filter=status:ACTIVE --format="value(account)"
      register: gcloud_auth
      changed_when: false
      failed_when: false

    - name: Require interactive gcloud login if no active account
      ansible.builtin.fail:
        msg: "No active gcloud auth found. Run 'gcloud auth login' or provide a service account key at {{ gcp_credentials_file_path }}"
      when: gcloud_auth.stdout | trim == ""

    - name: Set GCP project
      ansible.builtin.command: gcloud config set project {{ gcp_project_id }}
      register: set_project
      changed_when: false

    - name: Enable required GCP APIs
      ansible.builtin.shell: |
        gcloud services enable {{ item }} --project={{ gcp_project_id }}
      loop: "{{ required_gcp_services }}"

    - name: Create service account key if missing
      ansible.builtin.stat:
        path: "{{ gcp_credentials_file_path }}"
      register: cred_file

    - name: Create new service account key
      ansible.builtin.command: >
        gcloud iam service-accounts keys create "{{ gcp_credentials_file_path }}"
        --iam-account="{{ service_account_email }}"
      when: not cred_file.stat.exists

    - name: Activate the service account
      ansible.builtin.command: gcloud auth activate-service-account --key-file={{ gcp_credentials_file_path }}
      register: activate_sa
      changed_when: false

    - name: Ensure terraform state bucket exists
      ansible.builtin.shell: |
        if gsutil ls "gs://{{ terraform_state_bucket }}" >/dev/null 2>&1; then
          echo exists
        else
          gsutil mb -p "{{ gcp_project_id }}" -l us-west1 "gs://{{ terraform_state_bucket }}" && gsutil versioning set on "gs://{{ terraform_state_bucket }}" && echo created
        fi
      register: bucket_result

    - name: Ensure required IAM roles on service account
      vars:
        sa_member: "serviceAccount:{{ service_account_email }}"
      ansible.builtin.shell: |
        if gcloud projects get-iam-policy {{ gcp_project_id }} --flatten="bindings[].members" --format="table(bindings.role)" --filter="bindings.members:{{ sa_member }} AND bindings.role:{{ item }}" | grep -q "{{ item }}"; then
          echo exists
        else
          gcloud projects add-iam-policy-binding {{ gcp_project_id }} --member="{{ sa_member }}" --role="{{ item }}"
          echo added
        fi
      loop: "{{ required_roles }}"
      register: iam_role_changes
      failed_when: false

    - name: Update ansible/group_vars/all.yaml with credentials file path
      ansible.builtin.lineinfile:
        path: "{{ playbook_dir }}/group_vars/all.yaml"
        regexp: "^gcp_credentials_file:\\s*.*"
        line: "gcp_credentials_file: \"{{ gcp_credentials_file_path }}\""
        create: yes

    - name: Run provision_gke role (provision GKE via Terraform/OpenTofu)
      ansible.builtin.include_role:
        name: provision_gke
      vars:
        terraform_directory: "{{ (playbook_dir + '/../tofu/gke') | realpath }}"
        gcp_zone: "us-west1-c"
        gke_cluster_name: "{{ gcp_project_id }}-gke"
        terraform_backend_config:
          bucket: "{{ spezi_service_name }}-tf-state-prod"
          prefix: "gke/{{ spezi_service_name }}"
  # Do not pass gcp_credentials_file here to avoid recursive templating.
  # The role will pick up gcp_credentials_file from group_vars/all.yaml
  # or the file created/updated earlier in this play.

    - name: Ensure argocd namespace exists
      ansible.builtin.shell: kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -

    - name: Install ArgoCD (apply official manifest)
      ansible.builtin.shell: kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.1.4/manifests/install.yaml

    - name: Apply ArgoCD configmaps and patches from repo
      ansible.builtin.shell: |
        kubectl apply -f "{{ playbook_dir }}/../config/argocd/argocd-cm-config.yaml" || true
        kubectl apply -f "{{ playbook_dir }}/../config/argocd/argocd-tanka-cmp-configmap.yaml" || true
        kubectl patch deployment argocd-repo-server -n argocd --patch-file "{{ playbook_dir }}/../config/argocd/repo-server-patch.yaml" || true

    - name: Wait for ArgoCD pods to be ready
      ansible.builtin.shell: kubectl wait --for=condition=ready pod --all -n argocd --timeout=600s
      register: wait_argocd
      failed_when: wait_argocd.rc != 0

    - name: Create ArgoCD root application manifest
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: "{{ argo_application_name }}"
            namespace: argocd
          spec:
            project: default
            source:
              repoURL: "{{ repo_url }}"
              path: "{{ prod_path }}"
              targetRevision: "{{ git_branch }}"
              directory:
                exclude: "spec.json"
                jsonnet:
                  tlas:
                    - name: gitBranch
                      value: "{{ git_branch }}"
            destination:
              server: https://kubernetes.default.svc
              namespace: argocd
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - ServerSideApply=true

    - name: Wait for root application to be created and synced
      vars:
        check_cmd: "kubectl get application {{ argo_application_name }} -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || true"
      retries: 40
      delay: 10
      ansible.builtin.shell: "{{ check_cmd }}"
      register: root_app_status
      until: root_app_status.stdout.find('Synced') != -1

    - name: Wait for critical wave0 applications to be healthy (best-effort)
      vars:
        wave0_apps:
          - prod-namespace
          - prod-cloudnative-pg-crds
      block:
        - name: Check each app status
          ansible.builtin.shell: |
            for app in {{ wave0_apps | to_json }}; do
              kubectl get application "$app" -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || echo NA
            done
          register: wave0_status
          failed_when: false
          retries: 30
          delay: 15
          until: wave0_status.stdout is defined
      rescue:
        - ansible.builtin.debug:
            msg: "Wave0 health check timed out; proceeding anyway."

    - name: Wait for spezistudyplatform namespace to exist
      vars:
        check_ns_cmd: kubectl get namespace spezistudyplatform >/dev/null 2>&1; echo $?
      retries: 20
      delay: 15
      ansible.builtin.shell: "{{ check_ns_cmd }}"
      register: ns_check
      until: ns_check.stdout.strip() == '0'

    - name: Wait for Keycloak statefulset and pod to be ready
      retries: 30
      delay: 15
      ansible.builtin.shell: |
        if kubectl get statefulset keycloak -n spezistudyplatform >/dev/null 2>&1; then
          ready=$(kubectl get pod keycloak-0 -n spezistudyplatform -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo '')
          if [ "$ready" = "True" ]; then
            echo ready
          else
            echo notready
          fi
        else
          echo missing
        fi
      register: keycloak_ready
      until: keycloak_ready.stdout.strip() == 'ready'

    - name: Ensure external-secrets-system namespace exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: external-secrets-system

    - name: Create GCP service account secret for External Secrets (stringData)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: gcp-sa-key
            namespace: external-secrets-system
          stringData:
            secret-access-credentials: "{{ lookup('file', gcp_credentials_file_path) }}"

    - name: Run Keycloak bootstrap playbook
      ansible.builtin.command: ansible-playbook "{{ playbook_dir }}/bootstrap-keycloak.yaml"
      register: keycloak_bootstrap_result
      failed_when: keycloak_bootstrap_result.rc != 0
