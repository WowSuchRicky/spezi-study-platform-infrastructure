# bootstrap-keycloak.yaml
---
- name: Apply OpenTofu Configuration for Keycloak Realm with K8s Secret
  hosts: localhost # Assuming run from where tofu & kubectl are configured
  gather_facts: true
  vars:
    # Use local-dev version when LOCAL_DEV_MODE is set, otherwise use source version
    keycloak_tofu_directory: "{{ './tofu/keycloak-bootstrap/tf' if ansible_env.LOCAL_DEV_MODE is not defined else './tofu/keycloak-bootstrap/tf' }}"
    kind_cluster_name: "{{ ansible_env.KIND_CLUSTER_NAME | default('spezi-study-platform', true) }}"

    # These two fields should match what is in kubernetes, as this playbook will retrieve it from there
    keycloak_secret_name: "keycloak"
    keycloak_secret_namespace: "spezistudyplatform"
    # This should match the variable name expected in your Keycloak provider block
    tofu_password_var_name: "keycloak_password"

    # Do not edit any of the variables below:
    keycloak_tofu_dir: "{{ keycloak_tofu_directory | realpath }}"


  tasks:
    # --- Directory and .tf File Checks ---
    - name: Check if Keycloak OpenTofu directory exists
      ansible.builtin.stat:
        path: "{{ keycloak_tofu_dir }}"
      register: tofu_dir_stat

    - name: Fail if Keycloak Tofu directory not found
      when: not tofu_dir_stat.stat.exists or not tofu_dir_stat.stat.isdir
      ansible.builtin.fail:
        msg: "OpenTofu directory {{ keycloak_tofu_dir }} not found. Skipping Keycloak Tofu configuration."

    - name: Check if {{ keycloak_tofu_dir }} contains .tf files
      when: tofu_dir_stat.stat.exists and tofu_dir_stat.stat.isdir
      ansible.builtin.find:
        paths: "{{ keycloak_tofu_dir }}"
        patterns: "*.tf"
        recurse: no # Check only in the immediate directory
      register: tf_files_check

    - name: Fail if no .tf files found in {{ keycloak_tofu_dir }}
      when: tf_files_check.matched == 0
      ansible.builtin.fail:
        msg: "No .tf files found in {{ keycloak_tofu_dir }}. Skipping Keycloak Tofu configuration."

    # --- Fetch Keycloak Admin Password from Kubernetes ---
    - name: Get Keycloak admin secret from Kubernetes
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ keycloak_secret_name }}"
        namespace: "{{ keycloak_secret_namespace }}"
      register: keycloak_secret_result
      failed_when: keycloak_secret_result.resources | length == 0
      retries: 3 # Add retries in case secret is not immediately available after Helm deploy
      delay: 10 # Wait 10 seconds between retries

    - name: Extract and decode Keycloak admin password
      ansible.builtin.set_fact:
        # Extract the base64 encoded password and decode it
        keycloak_admin_password: "{{ keycloak_secret_result.resources[0].data['admin-password'] | b64decode }}"
      when:
        - keycloak_secret_result.resources | length > 0
        - "'admin-password' in keycloak_secret_result.resources[0].data"
      no_log: true # Prevent password from being logged in Ansible output

    - name: Fail if admin password could not be extracted
      ansible.builtin.fail:
        msg: "Could not find 'admin-password' key in secret {{ keycloak_secret_name }} in namespace {{ keycloak_secret_namespace }}."
      when: keycloak_admin_password is not defined

    # --- Prepare Tofu Environment ---
    - name: Build Tofu environment dictionary with password
      ansible.builtin.set_fact:
        # Construct the dictionary correctly: {'TF_VAR_keycloak_password': <admin_password>}
        tofu_environment: "{{ {'TF_VAR_' + tofu_password_var_name : keycloak_admin_password} }}"
      no_log: true # Keep this step quiet too

    # --- Detect Environment ---
    - name: Detect local machine IP (shared helper script)
      ansible.builtin.shell: |
        bash "{{ playbook_dir }}/../scripts/get-local-ip.sh"
      register: local_ip_result
      changed_when: false
      failed_when: false

    - name: Normalise detected IP output
      ansible.builtin.set_fact:
        detected_local_ip: "{{ local_ip_result.stdout | default('') | trim }}"

    - name: Set keycloak domain for local development
      ansible.builtin.set_fact:
        keycloak_domain: "{{ detected_local_ip }}.nip.io"
      when: detected_local_ip | length > 0 and detected_local_ip != '127.0.0.1'

    - name: Set default domain when local IP detection failed
      ansible.builtin.set_fact:
        keycloak_domain: "{{ spezi_service_fqdn | default('platform.spezi.stanford.edu') }}"
      when: keycloak_domain is not defined

    - name: Debug detected domain
      ansible.builtin.debug:
        msg: "Detected keycloak_domain: {{ keycloak_domain | default('NOT SET') }}"

    - name: Set frontend URL based on detected domain
      ansible.builtin.set_fact:
        frontend_url: "https://spezi.{{ keycloak_domain }}"

    - name: Set Keycloak URL for local dev via port-forward
      when: keycloak_domain is search("nip.io")
      ansible.builtin.set_fact:
        keycloak_url: "http://127.0.0.1:8081/auth"

    - name: Set Keycloak URL for non-local environments
      when: keycloak_domain is not search("nip.io")
      ansible.builtin.set_fact:
        keycloak_url: "https://{{ keycloak_domain }}/auth"

    - name: Debug final Keycloak and frontend URLs
      ansible.builtin.debug:
        msg:
          - "Using keycloak_url: {{ keycloak_url }}"
          - "Using frontend_url: {{ frontend_url | default('NOT SET') }}"

    # --- Run OpenTofu ---
    - name: Execute OpenTofu configuration
      when: tofu_dir_stat.stat.exists and tofu_dir_stat.stat.isdir and tf_files_check.matched > 0
      block:
        - name: Determine kubeconfig source path
          ansible.builtin.set_fact:
            source_kubeconfig_path: "{{ ansible_env.KUBECONFIG | default('~/.kube/config', true) }}"

        - name: Attempt to retrieve Kind kubeconfig
          ansible.builtin.command: "kind get kubeconfig --name {{ kind_cluster_name }}"
          register: kind_kubeconfig_result
          changed_when: false
          failed_when: false

        - name: Use Kind kubeconfig when available
          when: kind_kubeconfig_result.rc == 0 and kind_kubeconfig_result.stdout != ""
          block:
            - name: Create temporary Kind kubeconfig file
              ansible.builtin.tempfile:
                state: file
                suffix: "-kind-kubeconfig"
              register: tofu_kind_kubeconfig_file

            - name: Write Kind kubeconfig file
              ansible.builtin.copy:
                dest: "{{ tofu_kind_kubeconfig_file.path }}"
                content: "{{ kind_kubeconfig_result.stdout }}"
                mode: "0600"

            - name: Use generated Kind kubeconfig as source
              ansible.builtin.set_fact:
                source_kubeconfig_path: "{{ tofu_kind_kubeconfig_file.path }}"
                tofu_kind_kubeconfig_path: "{{ tofu_kind_kubeconfig_file.path }}"

        - name: Create temporary kubeconfig for OpenTofu
          ansible.builtin.tempfile:
            state: file
            suffix: "-tofu-kubeconfig"
          register: tofu_kubeconfig_file

        - name: Flatten kubeconfig for current context
          ansible.builtin.command: kubectl config view --raw --minify --flatten
          environment:
            KUBECONFIG: "{{ tofu_kubeconfig_path }}"
          register: flattened_kubeconfig

        - name: Write temporary kubeconfig file
          ansible.builtin.copy:
            dest: "{{ tofu_kubeconfig_file.path }}"
            content: "{{ flattened_kubeconfig.stdout }}"
            mode: "0600"
          no_log: true

        - name: Set kubeconfig path for OpenTofu
          ansible.builtin.set_fact:
            tofu_kubeconfig_path: "{{ tofu_kubeconfig_file.path }}"

        - name: Clear existing local OpenTofu state for Keycloak
          when: keycloak_domain is search('nip.io')
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ keycloak_tofu_dir }}/terraform.tfstate"
            - "{{ keycloak_tofu_dir }}/terraform.tfstate.backup"

        - name: Run OpenTofu init in {{ keycloak_tofu_dir }}
          ansible.builtin.command: "tofu init -reconfigure"
          args:
            chdir: "{{ keycloak_tofu_dir }}"
          environment:
            KUBECONFIG: "{{ source_kubeconfig_path }}"
          changed_when: "'OpenTofu has been successfully initialized!' in init_result.stdout or 'successfully initialized!' in init_result.stdout"
          register: init_result

        - name: Run OpenTofu apply in {{ keycloak_tofu_dir }}
          ansible.builtin.command: "tofu apply -auto-approve"
          args:
            chdir: "{{ keycloak_tofu_dir }}"
          environment:
            KUBECONFIG: "{{ tofu_kubeconfig_path }}"
            TF_VAR_keycloak_client_id: "admin-cli"
            TF_VAR_keycloak_username: "user"
            TF_VAR_keycloak_password: "{{ keycloak_admin_password }}"
            TF_VAR_keycloak_url: "{{ keycloak_url }}"
            TF_VAR_frontend_url: "{{ frontend_url | default('https://spezi.platform.spezi.stanford.edu') }}"
            TF_VAR_gcp_project_id: "{{ ansible_env.GCP_PROJECT_ID | default('local-dev', true) }}"
            TF_VAR_enable_google_sso: "{{ ansible_env.ENABLE_GOOGLE_SSO | default('false', true) }}"
            TF_VAR_enable_vault_secret_sync: "{{ ansible_env.ENABLE_VAULT_SECRET_SYNC | default('true', true) }}"
            TF_VAR_kube_config_path: "{{ tofu_kubeconfig_path }}"
          changed_when: "'Apply complete!' in apply_result.stdout"
          register: apply_result

        - name: Display Tofu Apply Standard Output
          ansible.builtin.debug:
            msg: "{{ apply_result.stdout.splitlines() }}"
          when: apply_result.stdout is defined and apply_result.stdout | length > 0

        - name: Display Tofu Apply Standard Error (if any)
          ansible.builtin.debug:
            msg: "{{ apply_result.stderr.splitlines() }}"
          when: apply_result.stderr is defined and apply_result.stderr | length > 0
      always:
        - name: Remove temporary kubeconfig file
          when: tofu_kubeconfig_path is defined
          ansible.builtin.file:
            path: "{{ tofu_kubeconfig_path }}"
            state: absent

        - name: Remove temporary Kind kubeconfig file
          when: tofu_kind_kubeconfig_path is defined
          ansible.builtin.file:
            path: "{{ tofu_kind_kubeconfig_path }}"
            state: absent

        - name: Remove OpenTofu state artifacts after run
          when: keycloak_domain is defined and keycloak_domain is search('nip.io')
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ keycloak_tofu_dir }}/terraform.tfstate"
            - "{{ keycloak_tofu_dir }}/terraform.tfstate.backup"
