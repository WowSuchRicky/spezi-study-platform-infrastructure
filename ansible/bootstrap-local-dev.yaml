---
- name: Bootstrap Local Dev (kind) with ArgoCD + Tanka
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    kind_cluster_name: "spezi-study-platform"
    repo_url: "https://github.com/WowSuchRicky/spezi-study-platform-infrastructure.git"
    git_branch: "{{ lookup('ansible.builtin.pipe', 'git rev-parse --abbrev-ref HEAD') | default('main', true) }}"
    # Expected kubectl context name for kind clusters
    kind_context_name: "kind-{{ kind_cluster_name }}"

  tasks:
    - name: Generate kubeconfig for kind and set KUBECONFIG env
      ansible.builtin.shell: |
        set -e
        out="/tmp/kubeconfig-{{ kind_cluster_name }}.yaml"
        if ! kind get kubeconfig --name "{{ kind_cluster_name }}" > "$out" 2>/dev/null; then
          if [ "${NO_RECREATE_KIND:-0}" = "1" ]; then
            echo "RECREATE_FORBIDDEN"
            exit 1
          fi
          # try to recreate cluster if kubeconfig export failed (stopped control plane)
          kind delete cluster --name "{{ kind_cluster_name }}" || true
          kind create cluster --name "{{ kind_cluster_name }}" --config="{{ playbook_dir }}/../local-dev/kind-config.yaml"
          kind get kubeconfig --name "{{ kind_cluster_name }}" > "$out"
        fi
        echo "$out"
      register: kubeconfig_file_guard
      changed_when: false

    - name: Export KUBECONFIG fact for subsequent kubectl commands
      ansible.builtin.set_fact:
        kubeconfig_kind_path: "{{ kubeconfig_file_guard.stdout | trim }}"

    - name: Sanity check - ensure current kubectl context is kind
      ansible.builtin.shell: |
        set -e
        kubectl config use-context "kind-{{ kind_cluster_name }}" >/dev/null 2>&1 || true
        ctx=$(kubectl config current-context 2>/dev/null || echo "")
        echo "$ctx"
      register: current_ctx
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_kind_path }}"

    - name: Abort if not using a kind context (override with ALLOW_NON_KIND=1)
      ansible.builtin.fail:
        msg: >-
          Refusing to proceed: current kubectl context '{{ current_ctx.stdout | trim }}' is not a kind context.
          Set ALLOW_NON_KIND=1 to override, but be careful.
      when: (lookup('ansible.builtin.env', 'ALLOW_NON_KIND') | default('0')) != '1' and (current_ctx.stdout | trim) is not match('^kind-')

    - name: Ensure required CLIs are installed (kind, kubectl)
      ansible.builtin.shell: |
        command -v kind >/dev/null 2>&1 && command -v kubectl >/dev/null 2>&1
      changed_when: false

    - name: Detect local IP
      ansible.builtin.shell: |
        bash "{{ playbook_dir }}/../scripts/get-local-ip.sh"
      register: local_ip
      changed_when: false

    - name: Create KIND cluster if missing
      ansible.builtin.shell: |
        if ! kind get clusters | grep -q "^{{ kind_cluster_name }}$"; then
          kind create cluster --name "{{ kind_cluster_name }}" --config="{{ playbook_dir }}/../local-dev/kind-config.yaml"
        fi
      changed_when: false

    - name: Detect existing kind context name
      ansible.builtin.shell: |
        kubectl config get-contexts -o name | grep -E "^kind-.*{{ kind_cluster_name }}$|^{{ kind_cluster_name }}$" | head -n1 || true
      register: found_ctx
      changed_when: false

    - name: Switch kubectl context to detected kind context (if found)
      ansible.builtin.shell: kubectl config use-context "{{ found_ctx.stdout | trim }}"
      when: (found_ctx.stdout | trim) != ''
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_kind_path }}"

    - name: Regenerate kubeconfig from kind as fallback (if no context found)
      ansible.builtin.shell: |
        kind get kubeconfig --name "{{ kind_cluster_name }}" > "/tmp/kubeconfig-{{ kind_cluster_name }}.yaml"
        echo "/tmp/kubeconfig-{{ kind_cluster_name }}.yaml"
      register: kubeconfig_file
      when: (found_ctx.stdout | trim) == ''
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_kind_path }}"

    - name: Ensure argocd namespace exists
      ansible.builtin.shell: kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_kind_path }}"

    - name: Install ArgoCD (matching prod script version)
      ansible.builtin.shell: kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.1.4/manifests/install.yaml
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_kind_path }}"

    - name: Apply ArgoCD configmaps and patches from repo
      ansible.builtin.shell: |
        kubectl apply -f "{{ playbook_dir }}/../config/argocd/argocd-cm-config.yaml" || true
        kubectl apply -f "{{ playbook_dir }}/../config/argocd/argocd-tanka-cmp-configmap.yaml" || true
        kubectl patch deployment argocd-repo-server -n argocd --patch-file "{{ playbook_dir }}/../config/argocd/repo-server-patch.yaml" || true
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_kind_path }}"

    - name: Wait for ArgoCD repo server rollout
      ansible.builtin.shell: kubectl -n argocd rollout status deployment argocd-repo-server
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_kind_path }}"

    - name: Create ArgoCD root application for local-dev bootstrap
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: root
            namespace: argocd
          spec:
            project: default
            source:
              repoURL: "{{ repo_url }}"
              path: environments/argocd-bootstrap
              targetRevision: "{{ git_branch }}"
              directory:
                exclude: "spec.json"
                jsonnet:
                  tlas:
                    - name: gitBranch
                      value: "{{ git_branch }}"
                    - name: localIP
                      value: "{{ local_ip.stdout | trim }}"
            destination:
              server: https://kubernetes.default.svc
              namespace: argocd
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - ServerSideApply=true
      environment:
        KUBECONFIG: "{{ kubeconfig_kind_path }}"

    - name: Wait for root app to be Synced (fail fast on Unknown)
      vars:
        check_cmd: "kubectl get application root -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || true"
      retries: 4
      delay: 10
      ansible.builtin.shell: "{{ check_cmd }}"
      register: root_app_status
      until: root_app_status.stdout.find('Synced') != -1
      failed_when: (root_app_status.stdout | trim) == '' or ((root_app_status.stdout | trim) | lower) == 'unknown'
      environment:
        KUBECONFIG: "{{ kubeconfig_kind_path | default(omit) }}"

    - name: Best-effort wait for key namespaces pods to be ready
      vars:
        key_namespaces:
          - argocd
          - spezistudyplatform
          - traefik
          - cert-manager
          - external-secrets-system
      ansible.builtin.shell: |
        ns={{ item }}
        if kubectl get ns "$ns" >/dev/null 2>&1; then
          kubectl wait --for=condition=ready pod --all -n "$ns" --timeout=600s || true
          echo "Waited for pods in namespace: $ns"
        else
          echo "Namespace not present (skipping): $ns"
        fi
      loop: "{{ key_namespaces }}"
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_kind_path | default(omit) }}"

    - name: Wait for wave0 applications to be healthy (best-effort)
      vars:
        wave0_apps:
          - local-dev-namespace
          - local-dev-cloudnative-pg-crds
      block:
        - name: Check each app status
          ansible.builtin.shell: |
            for app in {{ wave0_apps | to_json }}; do
              kubectl get application "$app" -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || echo NA
            done
          register: wave0_status
          failed_when: false
          retries: 30
          delay: 15
          until: wave0_status.stdout is defined
          environment:
            KUBECONFIG: "{{ kubeconfig_kind_path | default(omit) }}"
      rescue:
        - ansible.builtin.debug:
            msg: "Wave0 health check timed out; proceeding anyway."

    - name: Wait for spezistudyplatform namespace to exist
      vars:
        check_ns_cmd: kubectl get namespace spezistudyplatform >/dev/null 2>&1; echo $?
      retries: 20
      delay: 15
      ansible.builtin.shell: "{{ check_ns_cmd }}"
      register: ns_check
      until: ns_check.stdout.strip() == '0'
      environment:
        KUBECONFIG: "{{ kubeconfig_kind_path | default(omit) }}"

    - name: Wait for Keycloak statefulset and pod to be ready
      retries: 30
      delay: 15
      ansible.builtin.shell: |
        if kubectl get statefulset keycloak -n spezistudyplatform >/dev/null 2>&1; then
          ready=$(kubectl get pod keycloak-0 -n spezistudyplatform -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo '')
          if [ "$ready" = "True" ]; then
            echo ready
          else
            echo notready
          fi
        else
          echo missing
        fi
      register: keycloak_ready
      until: keycloak_ready.stdout.strip() == 'ready'
      environment:
        KUBECONFIG: "{{ kubeconfig_kind_path | default(omit) }}"

    - name: Bootstrap Keycloak via OpenTofu (reuse prod playbook)
      ansible.builtin.command: ansible-playbook "{{ playbook_dir }}/bootstrap-keycloak.yaml"
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_kind_path }}"

    - name: Pods summary (all namespaces)
      ansible.builtin.shell: kubectl get pods -A -o wide || true
      register: pods_summary
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_kind_path | default(omit) }}"

    - name: Show pods summary
      ansible.builtin.debug:
        var: pods_summary.stdout_lines
