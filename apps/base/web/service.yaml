apiVersion: v1
kind: Service
metadata:
  name: app-name-placeholder-web-service
  namespace: app-name-placeholder
spec:
  type: ClusterIP
  selector:
    app: app-name-placeholder-web
  ports:
    - name: main
      port: 80
      targetPort: 8080
