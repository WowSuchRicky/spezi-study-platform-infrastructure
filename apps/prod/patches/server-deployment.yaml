apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-name-placeholder-server
  namespace: app-name-placeholder
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    spec:
      initContainers:
        - name: app-name-placeholder-server-migrate
          image: ghcr.io/registry-org-placeholder/app-name-placeholder-server:main
          imagePullPolicy: Always
      containers:
        - name: app-name-placeholder-server-container
          image: ghcr.io/registry-org-placeholder/app-name-placeholder-server:main
          imagePullPolicy: Always
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "1"
