apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app-name-placeholder-server-pdb
  namespace: app-name-placeholder
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: app-name-placeholder-server
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app-name-placeholder-web-pdb
  namespace: app-name-placeholder
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: app-name-placeholder-web
